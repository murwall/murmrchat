name: Release

# Push a tag like v0.2.0 (matching "version" in src-tauri/tauri.conf.json) to build installers for
# macOS, Windows and Linux. They are attached to a DRAFT release; review it and click "Publish".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            platform: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Linux (x86_64)
            platform: ubuntu-22.04
            args: ""
            rust_targets: ""
          - name: Windows (x86_64)
            platform: windows-latest
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libdbus-1-dev patchelf build-essential pkg-config

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: MurmrChat ${{ github.ref_name }}
          releaseBody: |
            See the README for installation notes. These builds are not signed with an Apple Developer ID
            or a Windows code-signing certificate, so macOS and Windows will warn the first time you open them.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
